[project]
name = "vulncopilot"
version = "0.1.0"
description = "A retrieval-augmented generation chatbot built with Pydantic AI and Chainlit. Uses PostgreSQL with pgvector for persistent vector storage of CISA KEV data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.78.0",
    "asyncpg>=0.30.0",
    "azure-identity>=1.21.0",
    "azure-storage-blob>=12.25.0",
    "boto3>=1.40.61",
    "chainlit>=2.9.6",
    "httpx>=0.28.0",
    "openai>=2.17.0",
    "pgvector>=0.4.0",
    # Capped below v2: the CVE fixes this refresh needs all land in the v1 line
    # (>=1.106.0). The v2 major is a separate migration — see
    # plans/pydantic-ai-v2-migration.md — and needs code changes in app.py.
    "pydantic-ai>=1.106.0,<2",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "langfuse>=3.0.0",
    "fastmcp>=3.2.0",
    "logfire>=4.27.0",
    "azure-communication-email>=1.0.0",
    "jinja2>=3.1.6",
    "numpy>=2.5.2",
]

[project.urls]
Homepage = "https://vulncopilot.org"
Repository = "https://github.com/jeffhoek/vulncopilot"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["rag", "mcp_server"]
omit = ["scripts/*", "app.py", "config.py"]

[tool.coverage.report]
fail_under = 60

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".venv", "__pycache__", "data", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = [
    "S101",  # allow assert
    "S104",  # allow binding 0.0.0.0 (Docker)
    "S108",  # allow /tmp usage
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["S602", "S603", "E402"]  # allow subprocess and sys.path manipulation in scripts
# risk.py generates the v_cve_risk DDL by interpolating module constants (weights, the
# CWE map) into an f-string. No caller input reaches it — CVE IDs go to the database as
# bound parameters, never through here. A noqa can't be placed on the offending line
# because it is the opening quote of a multi-line string.
"rag/risk.py" = ["S608"]
# Same shape in database.py: RLS_SQL interpolates one module constant, the RLS_TABLES
# tuple of literal table names. Role names inside the generated PL/pgSQL come from
# pg_catalog through quote_ident(), and table names through format()'s %I — the
# identifier quoting the linter can't see because it happens in the database.
"rag/database.py" = ["S608"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
